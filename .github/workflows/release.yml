# Build the Windows installer and the portable zip, and publish them as a GitHub release.
#
# Release: set the version in pyproject.toml and src/unscanner/__init__.py, commit, push, then
#   git tag v0.2.0
#   git push origin v0.2.0
# The tag must be "v" plus that version, or the run stops before building anything.
#
# Run it by hand (Actions > Release > Run workflow) to build without releasing: the two files are then
# kept as the run's artifacts for a few days.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # gh release create

env:
  PYTHON_VERSION: "3.13"   # also the Python the portable zip embeds
  EPUBCHECK_VERSION: "5.3.0"

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(PYTHONPATH=src python -c "import unscanner; print(unscanner.__version__)")
          echo "pyproject.toml: $version, unscanner.__version__: $module"
          if [ "$version" != "$module" ]; then
            echo "::error::pyproject.toml says $version but src/unscanner/__init__.py says $module"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version (expected v$version)"; exit 1
          fi

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pytest -q

      - name: Get epubcheck
        run: |
          curl -fsSL -o epubcheck.zip "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          mkdir -p tools
          unzip -q epubcheck.zip -d tools
          test -f "tools/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar"

      - name: Get Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the portable zip
        run: python scripts/build_portable.py

      - name: Build the installer
        run: python scripts/build_installer.py

      # One artifact each, so people download only the one they need.
      - name: Keep the installer (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/Unscanner-Setup-*.exe
          retention-days: 7

      - name: Keep the portable zip (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: portable
          path: dist/unscanner-*-win64.zip
          retention-days: 7

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Unscanner ${GITHUB_REF_NAME#v}" \
            dist/Unscanner-Setup-*.exe dist/unscanner-*-win64.zip
