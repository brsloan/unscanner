[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unscanner"
version = "0.2.0"
description = "Turn scanned PDFs into accessible HTML and EPUB using vision language models (CLI + MCP server)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ben Sloan" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "lxml>=5",
    "pillow>=10",
    "httpx>=0.27",
    "anthropic>=1.5",
    "mcp>=2.0",
    "rapidocr-onnxruntime>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest"]
keyring = ["keyring>=24"]  # keep API keys in the OS credential store instead of work/settings.json
window = ["pywebview>=6"]  # `unscanner ui` in its own window instead of a browser tab (Windows: WebView2)

[project.scripts]
unscanner = "unscanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unscanner = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
