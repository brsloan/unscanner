[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remediate"
version = "0.1.0"
description = "Turn scanned PDFs into accessible HTML and EPUB using vision language models (CLI + MCP server)."
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "lxml>=5",
    "pillow>=10",
    "httpx>=0.27",
    "anthropic>=1.5",
    "mcp>=2.0",
    "rapidocr-onnxruntime>=1.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
remediate = "remediate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
